spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:ilmiya_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
  cloud:
    consul:
      enabled: false
    vault:
      enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

ilmiya:
  seed:
    enabled: ${ilmiya.seed.enabled:${ilmiya.seed.enable:true}}
