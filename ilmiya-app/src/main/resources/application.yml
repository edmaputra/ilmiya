spring:
  application:
    name: ilmiya-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ilmiya_db}
    username: ${SPRING_DATASOURCE_USERNAME:ilmiya_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ilmiya_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  liquibase:
    enabled: true
  jackson:
    default-property-inclusion: non_null

iam:
  jwt:
    secret: ${IAM_JWT_SECRET:super-secret-jwt-signing-key-for-ilmiya-school-platform-which-must-be-at-least-256-bits!}
    access-token-expiration-seconds: ${IAM_JWT_ACCESS_TOKEN_EXPIRATION:3600}
    refresh-token-expiration-seconds: ${IAM_JWT_REFRESH_TOKEN_EXPIRATION:604800}
  management:
    endpoints:
      enabled: ${IAM_MANAGEMENT_ENDPOINTS_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

logging:
  level:
    root: INFO
    io.github.edmaputra.ilmiya: DEBUG

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5543/ilmiya_db}

ilmiya:
  seed:
    enabled: true

