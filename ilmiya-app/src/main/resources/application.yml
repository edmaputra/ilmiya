spring:
  application:
    name: ilmiya-backend
  config:
    import:
      - "optional:consul:"
      - "optional:vault://"
  cloud:
    consul:
      enabled: ${SPRING_CLOUD_CONSUL_ENABLED:true}
      host: ${SPRING_CLOUD_CONSUL_HOST:consul-server}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      config:
        enabled: ${SPRING_CLOUD_CONSUL_CONFIG_ENABLED:true}
        format: YAML
        prefix: config
        default-context: application
        data-key: data
      discovery:
        enabled: ${SPRING_CLOUD_CONSUL_DISCOVERY_ENABLED:true}
        instance-id: ${spring.application.name}:${random.value}
        service-name: ${spring.application.name}
        health-check-path: /actuator/health
        health-check-interval: 10s
        prefer-ip-address: true
    vault:
      enabled: ${SPRING_CLOUD_VAULT_ENABLED:true}
      uri: ${SPRING_CLOUD_VAULT_URI:http://vault:8200}
      connection-timeout: 5000
      read-timeout: 15000
      authentication: ${SPRING_CLOUD_VAULT_AUTHENTICATION:TOKEN}
      token: ${SPRING_CLOUD_VAULT_TOKEN:root}
      kv:
        enabled: true
        backend: secret
        default-context: application
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ilmiya_db}
    username: ${SPRING_DATASOURCE_USERNAME:ilmiya_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ilmiya_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  liquibase:
    enabled: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

iam:
  jwt:
    secret: ${IAM_JWT_SECRET:super-secret-jwt-signing-key-for-ilmiya-school-platform-which-must-be-at-least-256-bits!}
    access-token-expiration-seconds: ${IAM_JWT_ACCESS_TOKEN_EXPIRATION:3600}
    refresh-token-expiration-seconds: ${IAM_JWT_REFRESH_TOKEN_EXPIRATION:604800}
  auth:
    magic-link:
      enabled: ${IAM_MAGIC_LINK_ENABLED:true}
      expiration-seconds: ${IAM_MAGIC_LINK_EXPIRATION:900}
      base-url: ${ILMIYA_APP_BASE_URL:http://localhost:8080}
      allowed-redirect-hosts:
        - localhost
        - 127.0.0.1
  security:
    session:
      max-concurrent-sessions: ${IAM_SESSION_MAX_CONCURRENT:3}
      session-limit-strategy: ${IAM_SESSION_LIMIT_STRATEGY:TERMINATE_OLDEST}
      max-failed-login-attempts: ${IAM_SESSION_MAX_FAILED_ATTEMPTS:5}
      lockout-duration-seconds: ${IAM_SESSION_LOCKOUT_DURATION:900}
  management:
    endpoints:
      enabled: ${IAM_MANAGEMENT_ENDPOINTS_ENABLED:true}

ed-iam:
  security:
    filter:
      register-servlet: false
  auth:
    magic-link:
      endpoints:
        enabled: ${ED_IAM_MAGIC_LINK_ENDPOINTS_ENABLED:true}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

logging:
  level:
    root: INFO
    io.github.edmaputra.ilmiya: DEBUG
