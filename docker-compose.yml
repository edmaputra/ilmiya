services:
  postgres:
    image: postgres:17.8-alpine3.23
    container_name: ilmiya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ilmiya_db}
      POSTGRES_USER: ${POSTGRES_USER:-ilmiya_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ilmiya_password}
    ports:
      - "${POSTGRES_PORT:-5543}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ilmiya_user} -d ${POSTGRES_DB:-ilmiya_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ilmiya-network

  # Application service (can be started alongside postgres or built independently)
  ilmiya-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ilmiya-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ilmiya_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ilmiya_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ilmiya_password}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - ilmiya-network

  # Optional database management UI (run with: docker compose --profile tools up -d)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ilmiya-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ilmiya.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ilmiya-network

volumes:
  pgdata:
    driver: local
  pgadmin_data:
    driver: local

networks:
  ilmiya-network:
    driver: bridge
